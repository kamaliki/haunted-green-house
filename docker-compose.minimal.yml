services:
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: haunted-greenhouse-mqtt
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    networks:
      - greenhouse-network

  influxdb:
    image: influxdb:2.7
    container_name: haunted-greenhouse-influxdb
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=adminpassword
      - DOCKER_INFLUXDB_INIT_ORG=haunted-greenhouse
      - DOCKER_INFLUXDB_INIT_BUCKET=sensor-data
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=my-super-secret-auth-token
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2
    networks:
      - greenhouse-network

  postgres:
    image: postgres:16-alpine
    container_name: haunted-greenhouse-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=haunted_greenhouse
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - greenhouse-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  greenhouse-network:
    driver: bridge

volumes:
  influxdb-data:
  influxdb-config:
  postgres-data: