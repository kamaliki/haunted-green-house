services:
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: haunted-greenhouse-mqtt
    restart: unless-stopped
    ports:
      - "1883:1883"    # MQTT
      - "9001:9001"    # WebSocket
    volumes:
      - ./mqtt/config/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ./mqtt/data:/mosquitto/data
      - ./mqtt/log:/mosquitto/log
    networks:
      - greenhouse-network

  influxdb:
    image: influxdb:2.7
    container_name: haunted-greenhouse-influxdb
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=adminpassword
      - DOCKER_INFLUXDB_INIT_ORG=haunted-greenhouse
      - DOCKER_INFLUXDB_INIT_BUCKET=sensor-data
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=my-super-secret-auth-token
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2
    networks:
      - greenhouse-network

  postgres:
    image: postgres:16-alpine
    container_name: haunted-greenhouse-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=haunted_greenhouse
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - greenhouse-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: haunted-greenhouse-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_USER=postgres
      - DATABASE_PASSWORD=postgres
      - DATABASE_NAME=haunted_greenhouse
      - MQTT_BROKER_URL=mqtt://mosquitto:1883
      - MQTT_USERNAME=greenhouse
      - MQTT_PASSWORD=your-secure-password
      - MQTT_CLIENT_ID_PREFIX=haunted-greenhouse
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_TOKEN=my-super-secret-auth-token
      - INFLUXDB_ORG=haunted-greenhouse
      - INFLUXDB_BUCKET=sensor-data
      - JWT_SECRET=your-super-secret-jwt-key-change-this-in-production
      - JWT_EXPIRATION=24h
      - BCRYPT_ROUNDS=10
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      influxdb:
        condition: service_started
      mosquitto:
        condition: service_started
    networks:
      - greenhouse-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: haunted-greenhouse-frontend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:3000
      - INTERNAL_API_URL=http://backend:3000
      - NEXTAUTH_URL=http://localhost:3001
      - NEXTAUTH_SECRET=your-nextauth-secret-key
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    networks:
      - greenhouse-network

  simulator:
    build:
      context: ./simulator
      dockerfile: Dockerfile.dev
    container_name: haunted-greenhouse-simulator
    restart: unless-stopped
    environment:
      - MQTT_BROKER_URL=mqtt://mosquitto:1883
      - MQTT_USERNAME=greenhouse
      - MQTT_PASSWORD=your-secure-password
    depends_on:
      - mosquitto
    networks:
      - greenhouse-network

networks:
  greenhouse-network:
    driver: bridge

volumes:
  influxdb-data:
  influxdb-config:
  postgres-data:
